  <style>
/* ==========================================================
   Ai Schools app – styles
   Palette is taken from the school logo:
   indigo frame, sun yellow, ribbon red.
   ========================================================== */
:root{
  --indigo:#2f2e86;
  --indigo-deep:#1c1b5c;
  --sun:#fdd817;
  --sun-soft:#fff4a8;
  --red:#c41e24;
  --red-deep:#9e1419;
  --ink:#16153f;
  --muted:#5d5e85;
  --mist:#f3f4fb;
  --line:#dcdef1;
  --white:#fff;
  --ok:#16794a;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --tabbar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font-body);font-size:16px;line-height:1.55;color:var(--ink);
  background:var(--indigo-deep);
  background-image:repeating-conic-gradient(from 0deg at 50% 0%,rgba(253,216,23,.06) 0 5deg,transparent 5deg 10deg);
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
a{color:var(--indigo);text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;letter-spacing:-.01em}
.svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.app{
  position:relative;max-width:520px;margin:0 auto;min-height:100vh;background:var(--mist);
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 24px);
  box-shadow:0 0 60px rgba(0,0,0,.35);
}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--indigo);color:#fff;
  border-bottom:4px solid var(--sun);
}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.brand-logo{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;padding:3px}
.brand-logo img{height:100%;width:auto;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text strong{font-family:var(--font-display);font-size:1.15rem;font-weight:800}
.brand-text small{font-size:.75rem;color:var(--sun);font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}
.icon-btn .svg{width:24px;height:24px}

/* ---------- bottom tab bar ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(28,27,92,.08);
}
.tabbar a,.tabbar button{
  height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:.72rem;font-weight:600;color:var(--muted);position:relative;
}
.tabbar .svg{width:24px;height:24px}
.tabbar a.on{color:var(--indigo)}
.tabbar a.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--red);border-radius:0 0 4px 4px}

.wa-fab{
  position:fixed;z-index:29;right:max(14px,calc(50% - 260px + 14px));
  bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 14px);
  width:52px;height:52px;border-radius:50%;background:#1faa59;color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.28)
}
.wa-fab .svg{width:28px;height:28px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,9,40,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;right:0;width:min(86vw,360px);background:#fff;z-index:41;overflow-y:auto;
  transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.on{transform:none}
.drawer-head{background:var(--indigo);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;border-bottom:4px solid var(--sun);display:flex;gap:12px;align-items:center}
.drawer-head .brand-logo{width:52px;height:52px}
.drawer-head strong{display:block;font-family:var(--font-display);font-size:1.2rem}
.drawer-head small{display:block;font-size:.78rem;color:var(--sun-soft);line-height:1.3}
.drawer-head .icon-btn{margin-left:auto}
.drawer h4{font-size:.85rem;color:var(--muted);padding:16px 18px 6px;font-weight:700}
.drawer a.item,.drawer button.item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 18px;font-weight:600;color:var(--ink);
  border-left:4px solid transparent
}
.drawer a.item.on{background:var(--mist);border-left-color:var(--red);color:var(--indigo)}
.drawer a.item .svg,.drawer button.item .svg{color:var(--indigo)}
.drawer-foot{margin-top:auto;padding:16px 18px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}

/* ---------- hero ---------- */
.hero{
  position:relative;padding:26px 18px 64px;text-align:center;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(circle at 50% 108%,var(--sun) 0 22%,transparent 22.5%),
    repeating-conic-gradient(from 0deg at 50% 108%,#ffe24a 0 5deg,#fdd817 5deg 10deg);
}
.hero::after{
  content:"";position:absolute;left:-10%;right:-10%;bottom:-2px;height:38px;background:var(--mist);
  border-radius:50% 50% 0 0/100% 100% 0 0;
}
.hero .greet{font-weight:700;color:var(--indigo-deep);font-size:.95rem;margin-bottom:12px}
.hero-card{
  background:#fff;border-radius:22px;padding:14px 14px 8px;margin:0 auto;max-width:400px;
  border:3px solid var(--indigo);box-shadow:6px 6px 0 var(--indigo-deep);
}
.hero-card img.logos{width:100%;height:auto;border-radius:10px}
.hero-card img.tagline{width:72%;margin:0 auto;height:auto}
.hero h1{font-size:1.5rem;margin:18px 0 4px;color:var(--indigo-deep);font-weight:800}
.hero p{max-width:32ch;margin:0 auto 16px;font-weight:500;color:var(--indigo-deep)}
.hero .btn-row{position:relative;z-index:2;justify-content:center}

/* ---------- generic ---------- */
.section{padding:22px 16px 6px}
.section > h2.ribbon{margin-bottom:14px}
.ribbon{
  display:inline-block;background:var(--red);color:#fff;font-size:1.05rem;font-weight:800;
  padding:7px 30px 7px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%);
  margin-left:-16px;padding-left:30px;
}
.page-title{
  background:var(--indigo);color:#fff;padding:22px 16px 30px;position:relative;
}
.page-title h1{font-size:1.7rem;font-weight:800}
.page-title p{color:var(--sun-soft);margin-top:4px;font-size:.95rem}
.page-title::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--sun) 0 14px,var(--red) 14px 28px)}
.page{padding-bottom:12px}
.lead{color:var(--muted);margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;
  font-weight:700;background:var(--red);color:#fff;border:2px solid var(--red);transition:transform .12s,background .15s;
}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--red-deep)}
.btn.blue{background:var(--indigo);border-color:var(--indigo)}
.btn.blue:hover{background:var(--indigo-deep)}
.btn.ghost{background:#fff;color:var(--indigo);border-color:var(--indigo)}
.btn.ghost:hover{background:var(--mist)}
.btn.green{background:#1faa59;border-color:#1faa59}
.btn.small{min-height:38px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn.block{width:100%}
.panel{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}
.panel.accent{border-left:6px solid var(--sun)}
.panel.red{border-left:6px solid var(--red)}
.panel.blue{border-left:6px solid var(--indigo)}
.panel h3{font-size:1.1rem;margin-bottom:6px}
.panel p+p{margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tag{display:inline-block;background:var(--sun);color:var(--indigo-deep);font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:99px}
.tag.green{background:#d8f3e4;color:var(--ok)}
.tag.red{background:#fde0e1;color:var(--red-deep)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px;margin-top:-6px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:.76rem;font-weight:700;color:var(--ink)}
.quick .tile{
  width:100%;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;background:#fff;border:2px solid var(--line);color:var(--indigo)
}
.quick .tile .svg{width:28px;height:28px}
.quick a:nth-child(1) .tile{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.quick a:nth-child(2) .tile{background:var(--sun);color:var(--indigo-deep);border-color:var(--sun)}
.quick a:nth-child(3) .tile{background:var(--red);color:#fff;border-color:var(--red)}
.quick a:active .tile{transform:scale(.94)}

/* fee strip */
.feebox{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;border:2px solid var(--indigo);background:#fff}
.feebox div{padding:14px;text-align:center}
.feebox div+div{border-left:2px dashed var(--indigo);background:var(--sun-soft)}
.feebox b{display:block;font-family:var(--font-display);font-size:1.7rem;color:var(--indigo)}
.feebox span{font-size:.85rem;color:var(--muted);font-weight:600}

/* people */
.person{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line)}
.person.big{flex-direction:column;text-align:center;padding:18px}
.ph{
  width:74px;height:74px;border-radius:16px;background:var(--indigo);color:var(--sun);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:1.4rem;overflow:hidden;position:relative;flex:none
}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.person.big .ph{width:128px;height:128px;border-radius:50%;border:4px solid var(--sun);font-size:2.2rem}
.person h3{font-size:1.05rem}
.person .role{color:var(--red);font-weight:700;font-size:.85rem}
.person .quals{font-size:.85rem;color:var(--muted)}
blockquote{border-left:4px solid var(--sun);padding-left:12px;font-weight:600;color:var(--indigo-deep);margin:10px 0 0;text-align:left}

/* campuses */
.campus{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.campus-head{background:var(--indigo);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.campus-head h3{font-size:1.1rem}
.campus-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.row .svg{margin-top:3px;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--mist);
  font-weight:700;font-size:.85rem;color:var(--indigo);border:1px solid var(--line)
}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}

/* news */
.news-item{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line);display:flex;gap:12px}
.date-badge{flex:none;width:54px;height:58px;border-radius:12px;background:var(--red);color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;font-weight:800;line-height:1.05}
.date-badge b{font-family:var(--font-display);font-size:1.4rem}
.date-badge span{font-size:.7rem}
.news-item h3{font-size:1rem;margin-bottom:2px}

/* programs */
.prog{display:flex;gap:14px;background:#fff;border-radius:16px;padding:14px;border:1px solid var(--line)}
.prog .badge{width:46px;height:46px;border-radius:14px;background:var(--sun);color:var(--indigo-deep);display:grid;place-items:center;flex:none}
.prog .badge .svg{width:26px;height:26px}

/* gallery */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery button{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--indigo);border:0}
.gallery button:first-child{grid-column:span 2;aspect-ratio:16/9}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(20,19,60,.85));color:#fff;font-weight:700;font-size:.85rem;text-align:left}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(10,9,40,.92);display:grid;place-items:center;padding:20px}
.lightbox[hidden]{display:none}
.lightbox img{max-height:82vh;border-radius:12px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;color:#fff;background:rgba(255,255,255,.15);width:44px;height:44px;border-radius:12px;display:grid;place-items:center}

/* video */
video{width:100%;border-radius:14px;background:#000;aspect-ratio:16/9}

/* forms */
form.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{
  min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;width:100%
}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--indigo);outline:none}
.field .hint{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* tables */
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th{background:var(--indigo);color:#fff;text-align:left;padding:8px 10px;font-weight:700}
.table td{padding:8px 10px;border-bottom:1px solid var(--line)}
.table tr:last-child td{border-bottom:0}
.table td.num,.table th.num{text-align:right}
.scroll-x{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}

/* portal */
.profile{background:var(--indigo);color:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;border-bottom:6px solid var(--sun)}
.profile .ph{background:var(--sun);color:var(--indigo-deep)}
.profile h2{font-size:1.25rem}
.profile small{color:var(--sun-soft)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;color:var(--indigo)}
.stat span{font-size:.85rem;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--red));border-radius:99px}
details.acc{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden}
details.acc summary{padding:14px 16px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:1.4rem;color:var(--red)}
details.acc[open] summary::after{content:"–"}
details.acc .acc-body{padding:0 16px 16px}

/* receipt / result card */
.doc{background:#fff;border:2px solid var(--indigo);border-radius:14px;padding:16px}
.doc-head{display:flex;gap:12px;align-items:center;border-bottom:3px double var(--indigo);padding-bottom:10px;margin-bottom:12px}
.doc-head img{height:54px;width:auto}
.doc-head h3{font-size:1.1rem;color:var(--indigo)}
.doc-head small{color:var(--muted)}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.doc dt{color:var(--muted);font-weight:600}
.doc dd{font-weight:700}
.doc .sign{display:flex;justify-content:space-between;margin-top:26px;font-size:.8rem;color:var(--muted)}
.doc .sign span{border-top:1px solid var(--muted);padding-top:4px;min-width:38%;text-align:center}
.grade{display:inline-block;min-width:34px;text-align:center;font-weight:800;color:var(--red)}

/* misc */
.copy-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.copy-row:last-child{border-bottom:0}
.copy-row b{word-break:break-all}
.qr{width:170px;margin:8px auto 0;border-radius:12px;border:1px solid var(--line);background:#fff;padding:6px}
.recog{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:.78rem;font-weight:700}
.recog div{background:#fff;border-radius:14px;padding:10px 6px;border:1px solid var(--line)}
.recog img{height:52px;margin:0 auto 6px;object-fit:contain}
.footer{margin:26px 16px 0;padding:18px 14px;background:var(--indigo-deep);color:#fff;border-radius:16px;text-align:center;font-size:.85rem;border-bottom:5px solid var(--sun)}
.footer strong{font-family:var(--font-display);font-size:1rem;display:block}
.footer small{color:var(--sun-soft)}
.install{display:none;margin:14px 16px 0;padding:12px 14px;border-radius:14px;background:#fff;border:2px dashed var(--indigo);align-items:center;gap:12px;justify-content:space-between}
.install.on{display:flex}
.install b{font-size:.95rem}
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 74px);transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;
  transition:.25s;z-index:70;max-width:88vw;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}


/* ---------- splash & cookie consent ---------- */
.splash{
  position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#1e1c6b 0%,#2f2e86 55%,#3d3ba8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .45s ease,visibility .45s ease;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.35);background:#fff;object-fit:contain;padding:8px}
.splash strong{color:#fff;font-size:1.35rem;letter-spacing:.02em}
.splash small{color:rgba(255,255,255,.75);font-size:.9rem}
.splash .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-top:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.cookie{
  position:fixed;inset:0;z-index:10000;background:rgba(15,14,50,.72);
  display:flex;align-items:flex-end;justify-content:center;padding:16px;
  transition:opacity .3s ease,visibility .3s ease;
}
.cookie.hide{opacity:0;visibility:hidden;pointer-events:none}
.cookie-box{
  width:100%;max-width:420px;background:#fff;border-radius:18px 18px 22px 22px;
  padding:22px 20px 18px;box-shadow:0 -8px 40px rgba(0,0,0,.25);
  animation:cookieUp .35s ease;
}
@keyframes cookieUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.cookie-box h3{margin:0 0 8px;font-size:1.1rem;color:#2f2e86}
.cookie-box p{margin:0 0 16px;color:#555;font-size:.92rem;line-height:1.45}
.cookie-box .btn{width:100%}
.app.locked{visibility:hidden}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- print (receipts and result cards) ---------- */
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;border:0}
  .app{box-shadow:none}
  .splash,.cookie{display:none!important}
}

</style>

     ------------------------------------------------------ */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return 'Rs ' + Number(n).toLocaleString('en-PK'); }
  function wa(num, text) {
    return 'https://wa.me/92' + String(num).replace(/^0/, '') + '?text=' + encodeURIComponent(text || '');
  }
  function initials(name) {
    return String(name).replace(/^(Madam|Prof\.|Dr\.)\s+/g, '').split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  }
  function campusById(id) { return SCHOOL.campuses.filter(function (c) { return c.id === id; })[0] || SCHOOL.campuses[0]; }
  function today() { return new Date().toISOString().slice(0, 10); }
  function niceDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return { day: d.getDate(), mon: d.toLocaleString('en', { month: 'short' }) };
  }
  function grade(p) { return p >= 80 ? 'A+' : p >= 70 ? 'A' : p >= 60 ? 'B' : p >= 50 ? 'C' : p >= 40 ? 'D' : 'F'; }
  function monthOptions() {
    var y = new Date().getFullYear(), cur = new Date().getMonth(), out = '';
    for (var m = 0; m < 12; m++) {
      var label = new Date(y, m, 1).toLocaleString('en', { month: 'long' }) + ' ' + y;
      out += '<option' + (m === cur ? ' selected' : '') + '>' + label + '</option>';
    }
    return out;
  }
  function currentMonthLabel() { return new Date().toLocaleString('en', { month: 'long' }) + ' ' + new Date().getFullYear(); }
  function photo(file, name) {
    return '<span class="ph">' + esc(initials(name)) + (file ? '<img src="' + IMG(file) + '" alt="' + esc(name) + '" loading="lazy" onerror="this.remove()">' : '') + '</span>';
  }

  }
  function data(form) {
    var o = {}; new FormData(form).forEach(function (v, k) { o[k] = String(v).trim(); }); return o;
  }

  var FORMS = {
    admission: function (f) {
      var d = data(f), c = campusById(d.campus);
      var db = load();
      db.admissions.push({ date: today(), name: d.name, father: d.father, cls: d.cls, gender: d.gender, campus: d.campus, phone: d.phone, sibling: d.sibling === 'yes', note: d.note });
      save();
      var msg = 'Assalamualaikum. Admission request for Ai Schools ' + c.name + '.\nStudent: ' + d.name + ' (' + d.gender + ')\nFather/guardian: ' + d.father +
        '\nClass: ' + d.cls + '\nSibling in school: ' + (d.sibling === 'yes' ? 'Yes' : 'No') + '\nPhone: ' + d.phone + (d.note ? '\nMessage: ' + d.note : '');
      window.open(wa(c.phones[0], msg), '_blank');
      f.reset();
      toast('Admission request saved. Continue in WhatsApp.');
    },
    login: function (f) {
      var d = data(f), st = login(d.roll, d.pass);
      if (!st) return toast('Roll number or password is wrong.');
      setSession({ role: 'student', roll: st.roll });
      route();
    },
    adminlogin: function (f) {
      if (data(f).pass !== SCHOOL.adminPassword) return toast('Wrong staff password.');
      setSession({ role: 'admin' });
      route();
    },
    addstudent: function (f) {
      var d = data(f), db = load();
      d.roll = d.roll.toUpperCase();
      if (findStudent(d.roll)) return toast('That roll number already exists.');
      db.students.push({ roll: d.roll, pass: d.pass, name: d.name, father: d.father, cls: d.cls, campus: d.campus, sibling: d.sibling === 'yes', attendance: { present: 0, total: 0 }, exam: '', results: [] });
      save(); toast('Student added: ' + d.roll); rerender();
    },
    addmarks: function (f) {
      var d = data(f), st = findStudent(d.roll);
      if (!st) return toast('No student with that roll number.');
      var got = +d.got, total = +d.total;
      if (got > total) return toast('Marks cannot be more than total marks.');
      if (st.exam !== d.exam) { st.exam = d.exam; st.results = []; }
      var row = st.results.filter(function (r) { return r.subject.toLowerCase() === d.subject.toLowerCase(); })[0];
      if (row) { row.got = got; row.total = total; } else st.results.push({ subject: d.subject, got: got, total: total });
      save(); toast('Marks saved for ' + st.name); f.elements.subject.value = ''; f.elements.got.value = '';
    },
    setatt: function (f) {
      var d = data(f), st = findStudent(d.roll);
      if (!st) return toast('No student with that roll number.');
      if (+d.present > +d.total) return toast('Days present cannot be more than total days.');
      st.attendance = { present: +d.present, total: +d.total };
      save(); toast('Attendance saved for ' + st.name);
    },
    postnews: function (f) {
      var d = data(f), db = load();
      db.news.push({ id: 'n' + Date.now(), date: today(), title: d.title, text: d.text });
      save(); f.reset(); toast('News published');
    },
    pay: function (f) {
      var d = data(f), st = findStudent(d.roll);
      if (!st) return toast('No student with that roll number.');
      var p = { id: 'R-' + String(Date.now()).slice(-6), roll: st.roll, amount: +d.amount, month: d.month, method: d.method, date: today() };
      load().payments.push(p); save();
      $('#receipt').innerHTML = receiptHTML(p, st);
      $('#receipt').scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast('Payment recorded');
    },
    result: function (f) {
      var d = data(f), st = login(d.roll, d.pass);
      if (!st) return toast('Roll number or password is wrong.');
      if (!st.results.length) { $('#card').innerHTML = '<div class="empty">No marks have been entered yet.</div>'; return; }
      $('#card').innerHTML = resultHTML(st);
      $('#card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    viewatt: function (f) {
      var d = data(f), st = login(d.roll, d.pass);
      if (!st) return toast('Roll number or password is wrong.');
      $('#attCard').innerHTML = attCardHTML(st);
      $('#attCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast('Attendance loaded for ' + st.name);
    },
    setstaffatt: function (f) {
      var d = data(f), db = load();
      if (!db.staff) db.staff = [];
      var t = db.staff.filter(function (x) { return x.id.toUpperCase() === d.id.toUpperCase(); })[0];
      if (!t) return toast('No staff with that ID.');
      if (+d.present > +d.total) return toast('Days present cannot be more than total days.');
      t.present = +d.present; t.total = +d.total;
      save(); toast('Staff attendance saved for ' + t.name); rerender();
    }
  };

  var ACTIONS = {
    'open-menu': openMenu,
    'close-menu': closeMenu,
    logout: function () { setSession(null); route(); toast('Logged out'); },
    print: function () { window.print(); },
    reset: function () {
      if (!confirm('Reset all demo data on this device? Students, marks, payments and admissions will be cleared.')) return;
      mem = seed(); save(); rerender(); toast('Demo data reset');
    },
    copy: function (el) {
      var text = el.getAttribute('data-copy');
      function done() { toast('Copied'); }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, done);
      else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* ignore */ } ta.remove(); done(); }
    },
    zoom: function (el) {
      var lb = $('#lightbox');
      lb.innerHTML = '<button data-act="unzoom" aria-label="Close">' + ic('close') + '</button><img src="' + el.getAttribute('data-src') + '" alt="">';
      lb.hidden = false;
    },
    unzoom: function () { $('#lightbox').hidden = true; },
    install: function () {
      if (!deferredInstall) return toast('Use your browser menu: Add to Home screen.');
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function () { deferredInstall = null; var b = $('#installBox'); if (b) b.classList.remove('on'); buildDrawer(); });
    }
  };

  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    if (FORMS[f.getAttribute('data-form')]) FORMS[f.getAttribute('data-form')](f);
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && ACTIONS[el.getAttribute('data-act')]) { e.preventDefault(); ACTIONS[el.getAttribute('data-act')](el); return; }
    if (e.target.id === 'scrim') closeMenu();
    if (e.target.id === 'lightbox') ACTIONS.unzoom();
  });
  $('#menuBtn').addEventListener('click', function () { $('#drawer').classList.contains('on') ? closeMenu() : openMenu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeMenu(); ACTIONS.unzoom(); } });

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; refreshInstallBox(); buildDrawer(); });
  window.addEventListener('hashchange', route);

  /* ------------------------------------------------------
     8. START (splash logo → cookie consent → app)
     ------------------------------------------------------ */
  (function boot() {
    var splash = document.getElementById('splash');
    var cookie = document.getElementById('cookie');
    var app = document.getElementById('app');
    var logoEl = document.getElementById('splashLogo');
    if (logoEl && typeof LOGO_J !== 'undefined') logoEl.src = LOGO_J;

    function unlockApp() {
      if (app) app.classList.remove('locked');
      buildChrome();
      route();
    }

    function hideSplash(then) {
      if (!splash) { then(); return; }
      splash.classList.add('hide');
      splash.setAttribute('aria-hidden', 'true');
      setTimeout(then, 450);
    }

    function showCookie() {
      if (!cookie) { unlockApp(); return; }
      cookie.classList.remove('hide');
      cookie.setAttribute('aria-hidden', 'false');
    }

    function acceptCookie() {
      try { localStorage.setItem('ai_cookies_ok', '1'); } catch (e) { /* ignore */ }
      if (cookie) {
        cookie.classList.add('hide');
        cookie.setAttribute('aria-hidden', 'true');
      }
      unlockApp();
    }

    var btn = document.getElementById('acceptCookies');
    if (btn) btn.addEventListener('click', acceptCookie);

    var accepted = false;
    try { accepted = localStorage.getItem('ai_cookies_ok') === '1'; } catch (e) { /* ignore */ }

    // Show logo splash first (~1.4s), then cookie if needed, else open app
    setTimeout(function () {
      hideSplash(function () {
        if (accepted) unlockApp();
        else showCookie();
      });
    }, 1400);
  })();
})();

</script>
</body>
</html>
